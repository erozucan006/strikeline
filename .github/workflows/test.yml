name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm i --no-save @electric-sql/pglite@0.2.17 playwright@1.48.2
      - run: npx playwright install --with-deps chromium
      - name: Unit and database tests
        run: npm test
      - name: Browser tests (guest, accounts, snapshot fallback)
        run: |
          PORT=4173 node test/serve.js & PORT=4174 node test/serve.js --db & PORT=4175 node test/serve.js --down &
          sleep 3
          node test/e2e/run.cjs
